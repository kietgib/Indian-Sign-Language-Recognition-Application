<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
    <defs>
        <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4ade80" />
            <stop offset="100%" stop-color="#3b82f6" />
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.5" flood-color="#4ade80"/>
        </filter>
    </defs>
    <!-- Background rounded rect -->
    <rect width="120" height="120" rx="30" fill="#0f172a"/>
    
    <!-- Abstract skeleton points and connecting lines -->
    <g filter="url(#shadow)" stroke="url(#glow)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <!-- AI/Vision Eye or Tracking Node Center -->
        <path d="M40 85 C 40 85, 30 50, 45 40 C 60 30, 80 40, 80 60 C 80 80, 50 90, 40 85 Z"/>
        <!-- Hand / Fingers abstract skeleton -->
        <path d="M60 45 L 50 20"/>
        <path d="M70 45 L 75 15"/>
        <path d="M80 50 L 95 25"/>
    </g>

    <!-- Keypoints dots -->
    <g fill="#ffffff">
        <circle cx="45" cy="40" r="5" />
        <circle cx="60" cy="45" r="5" />
        <circle cx="70" cy="45" r="5" />
        <circle cx="80" cy="50" r="5" />
        <circle cx="80" cy="60" r="5" />
        <circle cx="40" cy="85" r="5" />
        <circle cx="50" cy="20" r="4" fill="#4ade80" />
        <circle cx="75" cy="15" r="4" fill="#3b82f6" />
        <circle cx="95" cy="25" r="4" fill="#4ade80" />
    </g>
</svg>
